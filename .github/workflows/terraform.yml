name: terraform

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=dev.tfstate" #create a dev env state file in the s3 bucket
      - run: terraform destroy -auto-approve -var-file=envs/dev.tfvars
      

  staging:
    needs: dev
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=staging.tfstate" #create a staging env state file in the s3 bucket
      - run: terraform destroy -auto-approve -var-file=envs/staging.tfvars

  prod:
    needs: staging
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }} #add your AWS credentials to the repo secrets
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} #add your AWS credentials to the repo secrets
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init -backend-config="key=prod.tfstate" #create a prod env state file in the s3 bucket
      - run: terraform destroy -auto-approve -var-file=envs/prod.tfvars